<html>
<head>
    <title>Pengaturan Padding Tabel</title>
    <style type="text/css">

        td.kiri {
            padding-top:20px;
            padding-right:2px;
            padding-bottom:2px;
            padding-left:2cm;
            background-color:#FF00FF;
                }

    </style>
</head>
<body>
<table border="1">
    <tr>
        <td class="kiri">
            Padding dengan jarak 2cm dari kiri, atas, kanan, dan bawah
        </td>

        <td>
            Tanpa Jarak
        </td>
    </tr>
</table>
</body>
</html>
